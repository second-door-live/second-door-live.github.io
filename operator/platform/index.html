<main>


<h1>Second Door Live: venue groups</h1>
<table><tr><th>Group</th><th>Domains</th><th>Venues</th></tr>
<tr><td>Another Venue</td><td>watch.another-venue.example
  <form method="post" action="#" class="inline"><input name="host" placeholder="watch.example.com" required><button class="link">Add domain</button></form></td>
  <td>1</td></tr><tr><td>Sample Venues</td><td>watch.sample-venues.example
  <form method="post" action="#" class="inline"><input name="host" placeholder="watch.example.com" required><button class="link">Add domain</button></form></td>
  <td>2</td></tr>
</table>
<h2>Add a venue group</h2>
<form method="post" action="#" class="card">
  <label>Name <input name="name" required></label><label>Short name <input name="slug" required pattern="[a-z0-9-]+"></label>
  <label>Domain <input name="host" required placeholder="watch.example.com"></label><label>First admin's email <input type="email" name="admin_email"></label>
  <button>Add</button></form>

</main>
<footer>Streams by <span class="by"><img src="../../static/brand/icon.svg" alt="">Second Door Live</span></footer>
