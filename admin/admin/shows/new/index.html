<main>


<h1>New show</h1>


<form method="post" action="#" class="card grid">
  <label>Venue <select name="venue_id"><option value="1" >Main Hall</option><option value="2" >Small Room</option></select></label>
  <label>Title <input name="title" required value=""></label>
  <label>Tier <select name="tier"><option value="happy_hour">Happy hour (1 credit, ends by 8 p.m.)</option><option value="main" >Main act</option></select></label>
  <label>Main act credits <select name="credit_cost"><option>3</option><option >4</option></select></label>
  <label>Date <input type="date" name="date" required value=""></label>
  <label>Starts <input type="time" name="start" required value=""></label>
  <label>Ends <input type="time" name="end" required value=""></label>
  <label>Full price for non-members $ <input name="full_price" required value=""></label>
  <label>Artist's name <input name="artist_name" value=""></label>
  <label>Artist's email (they are asked to agree) <input type="email" name="artist_email" value=""></label>
  <p><small>One credit is worth $5.00 to a member; the full price must be higher than the member price.</small></p>
  <button>Save as draft</button></form>

</main>
